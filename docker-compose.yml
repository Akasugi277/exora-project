services:
  postgres:
    image: postgres:16-alpine
    container_name: exora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - galileo_pg_data:/var/lib/postgresql/data
      - ./data/galileo-db/migrations:/docker-entrypoint-initdb.d
    networks: [exora]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: exora-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [exora]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jupiter:
    build:
      context: ./apps/bots/jupiter
    container_name: exora-jupiter
    env_file: .env
    restart: unless-stopped
    networks: [exora]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  saturn:
    build:
      context: ./apps/bots/saturn
    container_name: exora-saturn
    env_file: .env
    restart: unless-stopped
    networks: [exora]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  uranus:
    build:
      context: ./apps/bots/uranus
    container_name: exora-uranus
    env_file: .env
    restart: unless-stopped
    networks: [exora]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  neptune:
    build:
      context: ./apps/bots/neptune
    container_name: exora-neptune
    env_file: .env
    restart: unless-stopped
    networks: [exora]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./apps/dashboard/web-ui
    container_name: exora-dashboard
    env_file: .env
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    restart: unless-stopped
    networks: [exora]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  exora:
    driver: bridge

volumes:
  galileo_pg_data:
  redis_data:
